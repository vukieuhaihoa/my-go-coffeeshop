version: "2"

linters:
  default: standard        # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint
    - gocritic
    - misspell
    - revive
  settings:
    govet:
      enable:
        - shadow

formatters:
  enable:
    - gofumpt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/vukieuhaihoa/my-go-coffeeshop
