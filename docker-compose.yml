services:
  postgres:
    image: postgres:18-alpine
    container_name: my-go-coffeeshop-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

  product:
    build:
      context: .
      dockerfile: docker/Dockerfile.product
    image: my-go-coffeeshop-product
    environment:
      APP_NAME: product-service-in-docker
      LOG_LEVEL: debug
    ports:
      - "5001:5001"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 10s
    
volumes:
  postgres_data:

networks:
  default:
    name: my-go-coffeeshop-network
  